<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sign in | Frontline CDL</title>
  <link rel="icon" type="image/svg+xml" href="/static/frontline-cdl-mark.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/frontline-cdl-mark.png">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/workspace.css">
</head>
<body class="auth-body">
  <main class="auth-main" id="main">
    <div class="auth-card">
      <div class="auth-brand"><img class="brand-logo" src="/static/frontline-cdl-logo.svg" width="1894" height="319" alt="Frontline CDL"><small>Recruiter desk</small></div>
      <h1>Sign in</h1>
      <p class="auth-lede">Review new applicants and call them back in order.</p>

      <form class="form" id="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="btn btn-ghost reveal" id="reveal" type="button" aria-controls="password" aria-pressed="false">Show</button>
          </div>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
        <button class="btn btn-primary" id="submit" type="submit">Sign in</button>
      </form>
    </div>
    <p class="auth-foot">Demo environment. All applicant data is fictional.</p>
  </main>
  <script src="/static/login.js" defer></script>
</body>
</html>
