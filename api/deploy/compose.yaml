# Runs on hermes-vps in /opt/cdl-api, next to (not inside) the n8n project.
# The database is Supabase (DATABASE_URL in the server .env), so there is no local db service.
# No `ports:` anywhere: the API is reachable only from containers on n8n_app.
# Secrets live only in the server .env (chmod 600); compose reads it for ${...} interpolation.
name: cdl-api

services:
  cdl-api:
    build: ./src
    restart: unless-stopped
    # Only the DB URL: the API never needs the Zoho credentials.
    environment:
      DATABASE_URL: ${DATABASE_URL}
    # API_SHARED_SECRET (the key n8n sends as X-API-Key) lives in its own file so the worker,
    # which reads .env, never sees it. chmod 600, same as .env.
    env_file: .env.api
    networks: [n8n_app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Same image, different command: drains the outbox into Zoho Recruit. Migrations are
  # run by cdl-api at startup, so the worker waits for it to be healthy.
  worker:
    build: ./src
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      cdl-api: {condition: service_healthy}
    env_file: .env
    # Default network (outbound allowed, nothing can reach it): needs Supabase + Zoho only.
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  n8n_app:
    external: true
    name: n8n_app
